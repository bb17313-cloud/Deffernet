name: US Stock Finviz ChanLun Radar

on:
  schedule:
    # يعمل من الاثنين إلى الجمعة لتغطية Pre-Market وMain وPost-Market (08:00 - 01:00 UTC)
    - cron: "0 0,8-23 * * 1-5"
  workflow_dispatch:
    inputs:
      chan_intervals:
        description: "الأطر الزمنية لتشان لون مفصولة بفاصلة (مثال: 1m,5m,15m,1h,1d)"
        required: false
        default: "5m,15m,1h,1d"
      interval_seconds:
        description: "فترة التحديث بالثواني داخل الجلسة (الافتراضي 180)"
        required: false
        default: "180"

permissions:
  contents: write

jobs:
  run-us-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz requests urllib3 yfinance googletrans==4.0.0-rc1

      - name: Run US Finviz ChanLun Radar
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_FILE: "radar_state.json"
          RADAR_INTERVAL_SECONDS: ${{ inputs.interval_seconds || '180' }}
          RADAR_MAX_RUN_SECONDS: "3300"
          CHAN_INTERVALS: ${{ inputs.chan_intervals || '5m,15m,1h,1d' }}
        run: python main.py

      - name: Persist radar state
        if: always()
        run: |
          if [ -f radar_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add radar_state.json
            git diff --staged --quiet || git commit -m "chore: update radar_state.json"
            git push || true
          fi
