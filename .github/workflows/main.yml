name: Finviz Stock Radar Bot

on:
  schedule:
    # يعمل تلقائياً كل 5 إلى 10 دقائق خلال أوقات الجلسات (Pre-Market, Main, Post-Market) من الإثنين للجمعة
    - cron: '0/10 9-23 * * 1-5'
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت من واجهة GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Main Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
