name: CI/CD Main Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0/10 9-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz yfinance

      - name: Run Main Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Commit and push updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git pull origin main --rebase || echo "No remote changes to rebase"
          git add alerted_stocks.json
          git commit -m "Update daily alerted stocks state [skip ci]" || echo "No changes to commit"
          git push origin main
